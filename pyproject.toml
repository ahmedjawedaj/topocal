[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topocal"
version = "0.1.0"
description = "Risk calibration and selective fallback for neural PDE operators under topology shift."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TopoCal Contributors" }]
keywords = ["neural-operators", "pde", "uncertainty", "calibration", "scientific-ml", "topology"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
data = [
  "h5py>=3.10",
]
research = [
  "h5py>=3.10",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "torch>=2.4",
  "neuraloperator>=1.0",
  "gudhi>=3.10",
  "meshio>=5.3",
  "pyvista>=0.44",
]
dev = [
  "h5py>=3.10",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
]

[project.scripts]
topocal = "topocal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["h5py", "h5py.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["topocal"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
