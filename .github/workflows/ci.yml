name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/topocal
      - name: Test
        run: pytest --cov=topocal --cov-report=term-missing --cov-fail-under=90
      - name: Smoke test CLI
        run: topocal demo

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel in isolated environments
        run: |
          python -m pip install build twine
          python -m build --outdir dist
      - name: Check metadata and archive contents
        run: |
          python -m twine check dist/*
          python scripts/check_distribution.py dist
      - name: Install the extracted sdist with its dev extra and run its tests
        # The tests run from the extracted tree, outside the checkout, against a normal
        # (non-editable) install in a fresh environment with no PYTHONPATH. This is the only
        # check that notices files missing from the archive. Real-data tests are not part of
        # the sdist by design, so only the synthetic tests run.
        run: |
          SRC="$(python scripts/check_distribution.py dist --extract "$RUNNER_TEMP/sdist")"
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install "$SRC[dev]"
          cd "$SRC"
          env -u PYTHONPATH "$RUNNER_TEMP/sdist-env/bin/python" -c \
            "import topocal; assert 'site-packages' in topocal.__file__, topocal.__file__"
          env -u PYTHONPATH "$RUNNER_TEMP/sdist-env/bin/python" -m pytest -p no:cacheprovider
      - name: Smoke test the wheel in a NumPy-only environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/wheel-env/bin/python" -c \
            "import importlib.util as u; assert u.find_spec('h5py') is None; import topocal.datasets"
          env -u PYTHONPATH "$RUNNER_TEMP/wheel-env/bin/topocal" demo
